<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Visit | Perfect Games</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
.mockup{position:relative;width:100%;max-width:1600px;margin:0 auto;line-height:0}
.mockup img{display:block;width:100%;height:auto}
.field{position:absolute;line-height:normal;border:1px solid transparent;border-radius:5px;background:rgba(255,255,255,.03);color:#171717;font:inherit;font-size:clamp(9px,1.05vw,16px);padding:.6em .8em;min-width:0;min-height:0}
.field::placeholder{color:#777;opacity:.9}
.field:focus{outline:2px solid #ed171d;border-color:#ed171d;background:rgba(255,255,255,.96)}
.name{left:21.3%;top:46.1%;width:27.7%;height:4.3%}
.email{left:51%;top:46.1%;width:27.7%;height:4.3%}
.date{left:21.3%;top:56.7%;width:27.7%;height:4.4%}
.time{left:51%;top:56.7%;width:27.7%;height:4.4%;background-color:rgba(255,255,255,.03)}
.guests{left:21.3%;top:67.3%;width:57.4%;height:4.4%;background-color:rgba(255,255,255,.03)}
.submit{position:absolute;left:42.8%;top:73.6%;width:14.5%;height:5.2%;border:0;border-radius:999px;background:transparent;color:transparent;cursor:pointer}
.submit:focus-visible{outline:3px solid #171717;outline-offset:2px}
.nav-link{position:absolute;top:5.4%;height:4.1%;border-radius:999px}
.home{left:41.2%;width:5.8%}.ads{left:47.4%;width:4.5%}.form{left:52.2%;width:5.9%}.news{left:59.1%;width:4.4%}.community{left:63.5%;width:9.1%}
.book-link{position:absolute;right:1.1%;top:4.7%;width:10%;height:5.4%;border-radius:999px}
.brand-link{position:absolute;left:1.5%;top:1.5%;width:27.5%;height:11%}
.status{position:absolute;left:50%;top:82%;transform:translateX(-50%);font-size:12px;color:#171717;background:#fff;padding:4px 8px;border-radius:4px;display:none;line-height:normal}
@media(max-width:600px){.field{font-size:10px;padding:2px 4px}.status{font-size:10px}}
</style>
</head>
<body>
<main class="mockup" aria-label="Perfect Games booking form">
<img src="Perfect%20Games%20Booking%20Form%20Mockup.png" alt="Perfect Games booking form design with bowling and arcade graphics">
<a class="brand-link" href="index.html" aria-label="Perfect Games home"></a>
<a class="nav-link home" href="index.html" aria-label="Home"></a>
<a class="nav-link ads" href="ads.html" aria-label="Ads"></a>
<a class="nav-link form" href="form.html" aria-label="Form"></a>
<a class="nav-link news" href="#" aria-label="News"></a>
<a class="nav-link community" href="#" aria-label="Community"></a>
<a class="book-link" href="#name" aria-label="Book now"></a>
<form id="bookingForm" onsubmit="event.preventDefault(); const status=document.getElementById('status'); status.style.display='block'; status.textContent='Your details are filled in, but this page is not connected to a reservation system yet.';">
<input class="field name" id="name" name="name" aria-label="Name" type="text" placeholder="Enter your name" autocomplete="name" required>
<input class="field email" id="email" name="email" aria-label="Email" type="email" placeholder="Enter your email" autocomplete="email" required>
<input class="field date" id="date" name="date" aria-label="Preferred date" type="date" required>
<select class="field time" id="time" name="time" aria-label="Preferred time" required>
<option value="">Select a time</option><option>10:00 AM</option><option>11:00 AM</option><option>12:00 PM</option><option>1:00 PM</option><option>2:00 PM</option><option>3:00 PM</option><option>4:00 PM</option><option>5:00 PM</option><option>6:00 PM</option><option>7:00 PM</option><option>8:00 PM</option>
</select>
<select class="field guests" id="guests" name="guests" aria-label="Number of guests" required>
<option value="">Select number of guests</option><option>1–5 guests</option><option>6–10 guests</option><option>11–15 guests</option><option>16–20 guests</option><option>21–30 guests</option><option>31+ guests</option>
</select>
<button class="submit" type="submit" aria-label="Submit booking request"></button>
</form>
<div class="status" id="status" role="status"></div>
</main>
</body>
</html>
