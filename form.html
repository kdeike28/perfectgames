<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Now | PerfectGames</title>
  <style>
    :root { --ink: #111; --accent: #d71920; --muted: #4d4d4d; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; background: #e7e7e7; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    .page { max-width: 760px; margin: 24px auto; background: #fff; border: 3px solid var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 26px; background: #f7f7f7; border-bottom: 3px solid var(--ink); }
    .brand { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.05em; }
    a { color: inherit; }
    .content { padding: 32px 26px; }
    .eyebrow { display: inline-block; padding: 7px 10px; margin-bottom: 14px; background: var(--ink); color: #fff; font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.06em; }
    p { color: var(--muted); line-height: 1.55; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 7px; font-weight: 700; }
    input, select, textarea { width: 100%; padding: 12px; border: 2px solid var(--ink); background: #fafafa; font: inherit; }
    button { padding: 14px 18px; border: 3px solid var(--accent); background: var(--accent); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; }
    .note { font-size: .9rem; }
    @media (max-width: 520px) { body { padding: 10px; } header, .content { padding-left: 18px; padding-right: 18px; } }
  </style>
</head>
<body>
  <main class="page">
    <header><div class="brand">PerfectGames</div><a href="index.html">Back to Home</a></header>
    <section class="content">
      <span class="eyebrow">Now Booking</span>
      <h1>Book Your Visit</h1>
      <p>Fill out the details below to plan your PerfectGames visit.</p>
      <form action="#" method="get" onsubmit="event.preventDefault(); alert('Thanks! This demo form is not connected to a booking system yet.');">
        <label for="name">Full name<input id="name" name="name" autocomplete="name" required></label>
        <label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" required></label>
        <label for="date">Preferred date<input id="date" name="date" type="date" required></label>
        <label for="time">Preferred time<select id="time" name="time" required><option value="">Choose a time</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label>
        <label for="guests">Number of guests<select id="guests" name="guests" required><option value="">Choose party size</option><option>1</option><option>2</option><option>3–4</option><option>5–6</option><option>7 or more</option></select></label>
        <label for="notes">Anything else we should know? (optional)<textarea id="notes" name="notes" rows="3"></textarea></label>
        <button type="submit">Submit Booking Request</button>
      </form>
      <p class="note">This is a demo form and does not submit bookings to PerfectGames yet.</p>
    </section>
  </main>
</body>
</html>
