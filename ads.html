<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Games 728x90 Ad</title>
    <style>
      :root {
        --bg: #c9c9c9;
        --red: #e51b1b;
        --red-dark: #d30d0d;
        --black: #1f1f1f;
        --white: #f4f4f4;
        --gray-1: #7a7a7a;
        --gray-2: #4f4f4f;
        --gold: #f5c04c;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .artboard {
        width: 100%;
        max-width: 1280px;
        display: flex;
        justify-content: center;
        padding: 12px;
      }

      svg {
        display: block;
        width: 728px;
        height: 90px;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="artboard">
      <svg viewBox="0 0 728 90" role="img" aria-label="Perfect Games ad banner">
        <defs>
          <linearGradient id="redGrad" x1="0" x2="1">
            <stop offset="0%" stop-color="#e51818"/>
            <stop offset="100%" stop-color="#dd1c1c"/>
          </linearGradient>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.16)"/>
          </filter>
        </defs>

        <rect width="728" height="90" fill="#c7c7c7"/>

        <g transform="translate(0,0)">
          <g transform="translate(0,10)" filter="url(#shadow)">
            <text x="10" y="58" font-size="42" font-weight="900" fill="#111111" font-family="Arial, Helvetica, sans-serif" letter-spacing="-2">Perfect Games</text>
            <path d="M0 61 L300 61 L313 68 L520 68" stroke="#111111" stroke-width="6" fill="none" stroke-linecap="round"/>
            <text x="10" y="83" font-size="18" font-weight="700" fill="#111111" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.5">Bowling - Laser Tag - Arcade - Pizza - Sports Bar</text>
          </g>

          <g transform="translate(365,6)">
            <rect x="0" y="5" width="84" height="60" rx="2" fill="#d7d7d7" stroke="#3d3d3d" stroke-width="3"/>
            <rect x="10" y="15" width="64" height="42" fill="#e6dace" stroke="#3d3d3d" stroke-width="2"/>
            <rect x="22" y="2" width="40" height="6" fill="#c3c3c3" stroke="#4e4e4e" stroke-width="1.5"/>
            <circle cx="16" cy="68" r="4" fill="#2d2d2d"/>
            <circle cx="50" cy="68" r="4" fill="#2d2d2d"/>
            <circle cx="76" cy="68" r="4" fill="#2d2d2d"/>
            <path d="M0 70 L84 70" stroke="#1f1f1f" stroke-width="2"/>
            <rect x="29" y="55" width="26" height="21" fill="#2a2a2a"/>
            <rect x="35" y="52" width="14" height="5" fill="#3a3a3a"/>
            <path d="M52 60 L75 60" stroke="#1d1d1d" stroke-width="3"/>
            <path d="M76 40 L91 40" stroke="#1d1d1d" stroke-width="3"/>
            <circle cx="95" cy="40" r="7" fill="#e2e2e2" stroke="#1d1d1d" stroke-width="1.5"/>
            <circle cx="95" cy="40" r="3" fill="#bdbdbd"/>
            <path d="M103 28 L109 40 L105 41 L116 36" stroke="#1d1d1d" stroke-width="1.2" fill="none"/>
            <path d="M123 10 L127 18 L121 20 L132 24" stroke="#1d1d1d" stroke-width="1.2" fill="none"/>
          </g>

          <g transform="translate(515,14)" font-family="Arial, Helvetica, sans-serif">
            <path d="M4 35 L46 35" stroke="#111111" stroke-width="2" fill="none"/>
            <path d="M24 25 L24 56" stroke="#111111" stroke-width="2" fill="none"/>
            <path d="M16 35 L21 30 L27 35 L24 42 Z" fill="#111111"/>
            <circle cx="22" cy="47" r="15" fill="#ffffff" stroke="#111111" stroke-width="3"/>
            <path d="M18 55 L26 55" stroke="#111111" stroke-width="2"/>
            <path d="M30 42 A10 10 0 1 1 39 58" stroke="#111111" stroke-width="2" fill="none"/>
            <path d="M16 16 L25 24 L17 30" stroke="#111111" stroke-width="2" fill="none"/>
            <path d="M39 15 L30 23 L36 31" stroke="#111111" stroke-width="2" fill="none"/>
          </g>

          <g transform="translate(515,12)" font-family="Arial, Helvetica, sans-serif">
            <text x="0" y="0" font-size="24" font-weight="900" fill="#111111" letter-spacing="-1.2">Book your kids birthday party, group and</text>
            <text x="0" y="29" font-size="24" font-weight="900" fill="#111111" letter-spacing="-1.2">corporate events, or rent the venue!</text>
          </g>

          <g transform="translate(589,0)" font-family="Arial, Helvetica, sans-serif">
            <path d="M18 12 L26 0 L31 12 L44 14 L32 22 L35 36 L26 28 L17 36 L20 22 L8 14 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
            <path d="M54 0 L62 12 L76 14 L66 24 L70 38 L54 30 L42 38 L46 24 L36 14 L50 12 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
            <path d="M86 12 L95 0 L100 12 L113 14 L101 22 L104 34 L95 28 L86 34 L89 22 L79 14 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
          </g>

          <g transform="translate(641,4)">
            <path d="M20 18 C18 5, 31 0, 38 13 C40 18, 40 26, 36 32 C32 39, 25 42, 20 40 C14 38, 12 31, 15 25 C17 20, 18 18, 20 18 Z" fill="#f2f2f2" stroke="#111111" stroke-width="2"/>
            <circle cx="24" cy="16" r="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
            <path d="M23 0 L26 16" stroke="#111111" stroke-width="2"/>
            <path d="M10 18 L22 13" stroke="#111111" stroke-width="2"/>
            <path d="M38 18 L26 13" stroke="#111111" stroke-width="2"/>
            <path d="M15 25 L22 30" stroke="#111111" stroke-width="2"/>
            <path d="M34 25 L27 30" stroke="#111111" stroke-width="2"/>
            <path d="M20 42 L23 60" stroke="#111111" stroke-width="2"/>
            <path d="M28 42 L31 60" stroke="#111111" stroke-width="2"/>
            <path d="M16 62 L26 56" stroke="#111111" stroke-width="2"/>
            <path d="M32 62 L24 56" stroke="#111111" stroke-width="2"/>
          </g>

          <g transform="translate(519,50)" filter="url(#shadow)">
            <rect x="0" y="0" width="202" height="26" rx="13" fill="url(#redGrad)" stroke="#111111" stroke-width="2"/>
            <text x="101" y="18" text-anchor="middle" font-size="14" font-weight="900" fill="#fdfdfd" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">FILL OUT FORM TO GET STARTED!!!</text>
          </g>
        </g>
      </svg>
    </div>
  </body>
</html>
