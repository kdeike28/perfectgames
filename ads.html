<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Games Ad</title>
    <style>
      :root {
        --bg: #c6c6c6;
        --red: #eb1d1d;
        --dark-red: #d71414;
        --black: #171717;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .frame {
        width: 728px;
        height: 90px;
        background: var(--bg);
        overflow: hidden;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg viewBox="0 0 728 90" role="img" aria-label="Perfect Games banner ad">
        <defs>
          <linearGradient id="cta" x1="0" x2="1">
            <stop offset="0%" stop-color="#ef1d1d" />
            <stop offset="100%" stop-color="#d61212" />
          </linearGradient>
        </defs>

        <rect width="728" height="90" fill="#c6c6c6"/>

        <!-- left branding -->
        <g>
          <text x="12" y="43" font-size="36" font-weight="900" fill="#ef1d1d" stroke="#111111" stroke-width="2.3" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" letter-spacing="-1.7">Perfect Games</text>
          <path d="M8 55 H245" stroke="#151515" stroke-width="4" fill="none" stroke-linecap="round"/>
          <text x="14" y="76" font-size="12.5" font-weight="700" fill="#111111" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.2">Bowling - Laser Tag - Arcade - Pizza - Sports Bar</text>
        </g>

        <!-- arcade cabinet -->
        <g transform="translate(300,8)">
          <rect x="0" y="8" width="72" height="54" fill="#d7d7d7" stroke="#3a3a3a" stroke-width="2.5"/>
          <rect x="8" y="15" width="56" height="30" fill="#e8d9d4" stroke="#363636" stroke-width="2"/>
          <rect x="12" y="0" width="48" height="9" fill="#d3d3d3" stroke="#3a3a3a" stroke-width="1.5"/>
          <circle cx="12" cy="64" r="4" fill="#2a2a2a"/>
          <circle cx="35" cy="64" r="4" fill="#2a2a2a"/>
          <circle cx="58" cy="64" r="4" fill="#2a2a2a"/>
          <path d="M0 68 H72" stroke="#171717" stroke-width="2" fill="none"/>
          <rect x="22" y="46" width="28" height="15" fill="#2a2a2a"/>
          <path d="M35 58 H52" stroke="#171717" stroke-width="2.5" fill="none"/>
          <circle cx="58" cy="31" r="6.5" fill="#e9e9e9" stroke="#171717" stroke-width="1.4"/>
          <circle cx="58" cy="31" r="2.5" fill="#bcbcbc"/>
          <path d="M58 22 L66 30 L58 38" stroke="#171717" stroke-width="1.5" fill="none"/>
          <path d="M72 22 L78 27 L74 32" stroke="#171717" stroke-width="1.5" fill="none"/>
        </g>

        <!-- bowling pin / ball -->
        <g transform="translate(400,20)">
          <g>
            <path d="M0 24 L18 24 L18 8 L30 8 L30 24 L48 24 L48 12 L60 12 L60 24 L78 24 L78 0 L90 0 L90 24" stroke="#171717" stroke-width="1.8" fill="none"/>
            <circle cx="28" cy="35" r="2.5" fill="#171717"/>
          </g>
          <g transform="translate(62,12)">
            <circle cx="0" cy="18" r="16" fill="#f7f7f7" stroke="#171717" stroke-width="2"/>
            <path d="M-10 18 Q0 8 10 18" stroke="#171717" stroke-width="2" fill="none"/>
            <path d="M-7 18 L-2 13 M7 18 L2 13" stroke="#171717" stroke-width="2" fill="none"/>
          </g>
        </g>

        <!-- center text -->
        <g transform="translate(480,14)">
          <text x="0" y="0" font-size="14" font-weight="900" fill="#171717" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.45">Book your kids birthday party, group and</text>
          <text x="0" y="22" font-size="14" font-weight="900" fill="#171717" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.45">corporate events, or rent the venue!</text>
        </g>

        <!-- CTA -->
        <g transform="translate(486,52)">
          <rect x="0" y="0" width="219" height="27" rx="13.5" fill="url(#cta)" stroke="#171717" stroke-width="2"/>
          <text x="109.5" y="18" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.15">FILL OUT FORM TO GET STARTED!!!</text>
        </g>

        <!-- party decorations -->
        <g transform="translate(685,10)">
          <path d="M14 0 L20 18 L38 18 L24 28 L29 46 L14 34 L-1 46 L4 28 L-10 18 L8 18 Z" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
          <path d="M14 0 L14 46" stroke="#171717" stroke-width="1.5" fill="none"/>
        </g>
        <g transform="translate(684,20)">
          <path d="M8 0 L12 12 L24 13 L15 20 L18 33 L8 26 L-2 33 L1 20 L-8 13 L4 12 Z" fill="#ffffff" stroke="#171717" stroke-width="1.2"/>
        </g>
        <g transform="translate(702,8)">
          <path d="M12 0 L16 12 L28 14 L18 22 L22 34 L12 28 L2 34 L6 22 L-4 14 L8 12 Z" fill="#ffffff" stroke="#171717" stroke-width="1.2"/>
        </g>
      </svg>
    </div>
  </body>
</html>
