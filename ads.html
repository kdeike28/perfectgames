<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ads Layout</title>
    <style>
      :root {
        --page-bg: #ebebeb;
        --frame-bg: #f4f4f4;
        --slot-red: #d56d69;
        --slot-red-deep: #c76362;
        --slot-light: rgba(255,255,255,0.08);
        --slot-shadow: rgba(0,0,0,0.12);
        --label: rgba(255,255,255,0.93);
        --panel-line: rgba(255,255,255,0.95);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--page-bg);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 20px;
      }

      .layout {
        width: min(1180px, 100%);
        background: var(--frame-bg);
        border: 2px solid rgba(0,0,0,0.08);
        padding: 18px 20px 20px;
      }

      .top-banner {
        position: relative;
        width: 100%;
        height: 110px;
        margin-bottom: 18px;
        background: linear-gradient(135deg, #d66b67 0%, #d56a66 100%);
        border: 3px solid var(--panel-line);
        overflow: hidden;
      }

      .top-banner::before,
      .slot::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02) 24%, rgba(0,0,0,0.10) 100%);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }

      .top-banner::after,
      .slot::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, transparent 0%, rgba(0,0,0,0.12) 100%);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 22% 100%, 0 57%);
      }

      .slot {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--slot-red) 0%, var(--slot-red-deep) 100%);
        border: 3px solid var(--panel-line);
        overflow: hidden;
        color: var(--label);
        font-weight: 300;
        letter-spacing: -0.08em;
        text-shadow: 0 2px 8px rgba(0,0,0,0.12);
      }

      .label {
        position: relative;
        z-index: 1;
        font-size: clamp(1.9rem, 4vw, 5rem);
        line-height: 0.88;
      }

      .row {
        display: grid;
        grid-template-columns: 165px 1fr 300px;
        gap: 0;
        align-items: stretch;
      }

      .left-column {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .side-slot {
        width: 100%;
        height: 600px;
      }

      .middle-column {
        display: grid;
        grid-template-rows: 50px 1fr 280px;
      }

      .top-mid {
        width: 100%;
        height: 50px;
        margin-bottom: 0;
      }

      .center-box {
        position: relative;
        width: 100%;
        height: 250px;
      }

      .bottom-mid {
        width: 100%;
        height: 280px;
      }

      .right-column {
        display: flex;
      }

      .right-slot {
        width: 100%;
        min-height: 600px;
      }

      .left-column .label {
        font-size: clamp(1.8rem, 2.8vw, 4rem);
      }

      .middle-column .label,
      .right-column .label {
        font-size: clamp(2.1rem, 4vw, 4.6rem);
      }

      .small-label { font-size: clamp(2.2rem, 2.8vw, 4rem); }
      .medium-label { font-size: clamp(2.1rem, 3vw, 4rem); }
      .large-label { font-size: clamp(2.1rem, 3vw, 4rem); }

      @media (max-width: 980px) {
        .row {
          grid-template-columns: 1fr;
        }
        .left-column, .right-column, .middle-column {
          width: 100%;
        }
        .side-slot, .right-slot {
          height: 220px;
          min-height: 220px;
        }
        .middle-column {
          grid-template-rows: 50px 250px 280px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="top-banner slot">
        <div class="label">728x90</div>
      </div>

      <div class="row">
        <div class="left-column">
          <div class="slot side-slot">
            <div class="label">160<br>x600</div>
          </div>
        </div>

        <div class="middle-column">
          <div class="slot top-mid">
            <div class="label small-label">320x50</div>
          </div>

          <div class="slot center-box">
            <div class="label medium-label">300x250</div>
          </div>

          <div class="slot bottom-mid">
            <div class="label large-label">336x280</div>
          </div>
        </div>

        <div class="right-column">
          <div class="slot right-slot">
            <div class="label">300<br>x600</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
