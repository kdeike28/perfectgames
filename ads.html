<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PerfectGames Ads</title>
    <style>
      :root {
        --page-bg: #e9e9e9;
        --panel-bg: #efefef;
        --slot-red: #d66c67;
        --slot-red-deep: #c75b58;
        --slot-shadow: rgba(0, 0, 0, 0.12);
        --slot-border: #f3f3f3;
        --text: rgba(255, 255, 255, 0.9);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--page-bg);
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 26px;
      }

      .ads-board {
        width: min(1180px, 100%);
        background: var(--panel-bg);
        padding: 18px 18px 10px;
        border: 2px solid rgba(0, 0, 0, 0.08);
      }

      .slot {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        font-weight: 300;
        letter-spacing: -0.06em;
        background: var(--slot-red);
        border: 4px solid var(--slot-border);
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      }

      .slot::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.18));
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }

      .slot::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 42%, rgba(0,0,0,0.08) 100%);
      }

      .slot span {
        position: relative;
        z-index: 1;
        text-shadow: 0 2px 8px rgba(0,0,0,0.12);
      }

      .slot-top {
        width: 100%;
        height: 150px;
        margin-bottom: 18px;
        font-size: clamp(2.2rem, 4vw, 6rem);
      }

      .row {
        display: grid;
        grid-template-columns: 160px minmax(320px, 1fr) 300px;
        gap: 0;
        align-items: start;
      }

      .slot-vertical {
        width: 100%;
        min-height: 600px;
        height: 600px;
        font-size: clamp(2rem, 2.4vw, 4.1rem);
      }

      .middle-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 0 0 0 0;
      }

      .slot-small {
        width: 320px;
        height: 50px;
        margin-bottom: 0;
        font-size: clamp(1.5rem, 2vw, 3.2rem);
      }

      .slot-medium {
        width: 300px;
        height: 250px;
        margin-top: 0;
        font-size: clamp(2.2rem, 2.8vw, 4rem);
      }

      .slot-bottom {
        width: 336px;
        height: 280px;
        margin-top: 0;
        font-size: clamp(2.2rem, 2.8vw, 4rem);
      }

      .slot-right {
        width: 100%;
        min-height: 600px;
        height: 600px;
        font-size: clamp(2.2rem, 2.8vw, 4.1rem);
      }

      @media (max-width: 900px) {
        .row {
          grid-template-columns: 1fr;
        }

        .slot-vertical,
        .slot-right {
          min-height: 220px;
          height: 220px;
          width: 100%;
          max-width: 100%;
        }

        .middle-stage {
          width: 100%;
          align-items: stretch;
        }

        .slot-small,
        .slot-medium,
        .slot-bottom {
          width: 100%;
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="ads-board">
      <div class="slot slot-top"><span>728x90</span></div>

      <div class="row">
        <div class="slot slot-vertical"><span>160<br />x600</span></div>

        <div class="middle-stage">
          <div class="slot slot-small"><span>320x50</span></div>
          <div style="display:flex; align-items:flex-end; justify-content:center; gap:0; width:100%;">
            <div class="slot slot-medium" style="margin-right:0;"><span>300x250</span></div>
          </div>
          <div class="slot slot-bottom"><span>336x280</span></div>
        </div>

        <div class="slot slot-right"><span>300<br />x600</span></div>
      </div>
    </div>
  </body>
</html>
