<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Games 728x90</title>
    <style>
      :root {
        --bg: #c8c8c8;
        --red: #e61d1d;
        --red-dark: #d61111;
        --black: #1f1f1f;
        --white: #f4f4f4;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .frame {
        width: 728px;
        height: 90px;
        background: var(--bg);
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg viewBox="0 0 728 90" aria-label="Perfect Games banner" role="img">
        <defs>
          <linearGradient id="ctaRed" x1="0" x2="1">
            <stop offset="0%" stop-color="#e51d1d" />
            <stop offset="100%" stop-color="#d71414" />
          </linearGradient>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(0,0,0,0.18)"/>
          </filter>
        </defs>

        <rect width="728" height="90" fill="#c8c8c8"/>

        <g filter="url(#softShadow)">
          <g transform="translate(0,0)">
            <text x="12" y="48" font-size="35" font-weight="900" fill="#e61d1d" stroke="#111" stroke-width="2.4" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" letter-spacing="-1.8">Perfect Games</text>
            <path d="M6 57 H280" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M286 57 L332 57" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>
            <text x="14" y="77" font-size="13" font-weight="700" fill="#111" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.4">Bowling - Laser Tag - Arcade - Pizza - Sports Bar</text>
          </g>

          <g transform="translate(350,8)">
            <rect x="0" y="6" width="72" height="54" fill="#d9d9d9" stroke="#3a3a3a" stroke-width="2.5"/>
            <rect x="8" y="14" width="56" height="36" fill="#e5d9d4" stroke="#3a3a3a" stroke-width="2"/>
            <rect x="14" y="0" width="44" height="8" fill="#d1d1d1" stroke="#404040" stroke-width="1.5"/>
            <circle cx="12" cy="66" r="4" fill="#2d2d2d"/>
            <circle cx="36" cy="66" r="4" fill="#2d2d2d"/>
            <circle cx="60" cy="66" r="4" fill="#2d2d2d"/>
            <path d="M0 70 H72" stroke="#1a1a1a" stroke-width="2"/>
            <rect x="20" y="50" width="32" height="16" fill="#2a2a2a"/>
            <rect x="26" y="48" width="20" height="4" fill="#444"/>
            <path d="M42 60 H63" stroke="#1a1a1a" stroke-width="2.5"/>
            <circle cx="67" cy="35" r="7" fill="#e2e2e2" stroke="#1d1d1d" stroke-width="1.5"/>
            <circle cx="67" cy="35" r="2.5" fill="#b9b9b9"/>
            <path d="M70 30 L78 35 L70 40" stroke="#1d1d1d" stroke-width="1.5" fill="none"/>
            <path d="M85 26 L92 31 L87 37" stroke="#1d1d1d" stroke-width="1.5" fill="none"/>
            <path d="M93 15 L98 22 L91 24" stroke="#1d1d1d" stroke-width="1.5" fill="none"/>
          </g>

          <g transform="translate(442,18)">
            <g transform="translate(-10, 12)">
              <path d="M0 26 L18 26 L18 8 L30 8 L30 26 L48 26 L48 12 L60 12 L60 26 L78 26 L78 0 L90 0 L90 26" stroke="#111" stroke-width="2.2" fill="none"/>

              <path d="M42 28 L44 34 L48 28" stroke="#111" stroke-width="2" fill="none"/>
            </g>
            <g transform="translate(39,18)">
              <ellipse cx="0" cy="0" rx="15" ry="15" fill="#f0f0f0" stroke="#111" stroke-width="2"/>

            <g transform="translate(70,10)">

            </g>
          </g>

          <g transform="translate(520,18)">
            <text x="0" y="0" font-size="14" font-weight="900" fill="#111" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.4">Book your kids birthday party, group and</text>
            <text x="0" y="22" font-size="14" font-weight="900" fill="#111" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.4">corporate events, or rent the venue!</text>
          </g>

          <g transform="translate(500,52)">
            <rect x="0" y="0" width="210" height="27" rx="14" fill="url(#ctaRed)" stroke="#111" stroke-width="2"/>
            <text x="105" y="18" text-anchor="middle" font-size="13" font-weight="900" fill="#fff" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.2">FILL OUT FORM TO GET STARTED!!!</text>

      </svg>
    </div>
  </body>
</html>
