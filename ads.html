<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Games Banner</title>
    <style>
      :root {
        --bg: #c5c5c5;
        --red: #e91e1e;
        --red-dark: #d61111;
        --black: #171717;
        --white: #f5f5f5;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .banner-wrap {
        width: 728px;
        height: 90px;
        background: var(--bg);
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="banner-wrap">
      <svg viewBox="0 0 728 90" role="img" aria-label="Perfect Games banner ad">
        <defs>
          <linearGradient id="ctaGrad" x1="0" x2="1">
            <stop offset="0%" stop-color="#ef1d1d"/>
            <stop offset="100%" stop-color="#d81212"/>
          </linearGradient>
        </defs>

        <rect width="728" height="90" fill="#c5c5c5"/>

        <!-- Left logo -->
        <g>
          <text x="18" y="44" font-size="36" font-weight="900" fill="#ef1d1d" stroke="#111111" stroke-width="2.2" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" letter-spacing="-1.8">Perfect Games</text>
          <path d="M12 54 H238" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
          <text x="18" y="75" font-size="12.5" font-weight="700" fill="#111111" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.2">Bowling - Laser Tag - Arcade - Pizza - Sports Bar</text>
        </g>

        <!-- arcade machine -->
        <g transform="translate(292,10)">
          <rect x="0" y="10" width="72" height="54" fill="#d3d3d3" stroke="#3a3a3a" stroke-width="2.5"/>
          <rect x="8" y="18" width="56" height="30" fill="#e9d8d3" stroke="#393939" stroke-width="2"/>
          <rect x="13" y="0" width="44" height="9" fill="#d4d4d4" stroke="#3a3a3a" stroke-width="1.5"/>

          <circle cx="12" cy="64" r="4" fill="#2c2c2c"/>
          <circle cx="34" cy="64" r="4" fill="#2c2c2c"/>
          <circle cx="56" cy="64" r="4" fill="#2c2c2c"/>
          <path d="M0 68 H72" stroke="#171717" stroke-width="2" fill="none"/>

          <rect x="21" y="48" width="30" height="15" fill="#2a2a2a"/>
          <path d="M34 59 H52" stroke="#171717" stroke-width="2.4" fill="none"/>

          <circle cx="58" cy="32" r="7" fill="#ebebeb" stroke="#171717" stroke-width="1.5"/>
          <circle cx="58" cy="32" r="2.5" fill="#b7b7b7"/>
          <path d="M58 23 L67 31 L58 39" stroke="#171717" stroke-width="1.5" fill="none"/>
          <path d="M73 22 L79 28 L75 33" stroke="#171717" stroke-width="1.5" fill="none"/>
        </g>

        <!-- bowling pin + ball -->
        <g transform="translate(400,20)">
          <g>
            <path d="M0 24 L18 24 L18 8 L30 8 L30 24 L48 24 L48 12 L60 12 L60 24 L78 24 L78 0 L90 0 L90 24" stroke="#111111" stroke-width="1.8" fill="none"/>
            <circle cx="28" cy="35" r="2.5" fill="#111111"/>
          </g>

          <g transform="translate(60,12)">
            <circle cx="0" cy="18" r="15" fill="#f6f6f6" stroke="#111111" stroke-width="2"/>
            <path d="M-10 18 Q0 8 10 18" stroke="#111111" stroke-width="2" fill="none"/>
            <path d="M-7 18 L-2 13 M7 18 L2 13" stroke="#111111" stroke-width="2" fill="none"/>
          </g>
        </g>

        <!-- middle text -->
        <g transform="translate(470,14)">
          <text x="0" y="0" font-size="14" font-weight="900" fill="#111111" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.5">Book your kids birthday party, group and</text>
          <text x="0" y="22" font-size="14" font-weight="900" fill="#111111" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.5">corporate events, or rent the venue!</text>
        </g>

        <!-- CTA button -->
        <g transform="translate(496,52)">
          <rect x="0" y="0" width="214" height="27" rx="13.5" fill="url(#ctaGrad)" stroke="#111111" stroke-width="2"/>
          <text x="107" y="18" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.15">FILL OUT FORM TO GET STARTED!!!</text>
        </g>

        <!-- party hat and star burst -->
        <g transform="translate(680,8)">
          <path d="M14 0 L20 18 L38 18 L24 28 L29 46 L14 34 L-1 46 L4 28 L-10 18 L8 18 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
          <path d="M14 0 L14 46" stroke="#111111" stroke-width="1.5" fill="none"/>
        </g>
        <g transform="translate(680,20)">
          <path d="M8 0 L12 12 L24 13 L15 20 L18 33 L8 26 L-2 33 L1 20 L-8 13 L4 12 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
        </g>
        <g transform="translate(700,10)">
          <path d="M10 0 L14 10 L24 12 L16 18 L19 30 L10 24 L1 30 L4 18 L-4 12 L6 10 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
        </g>
      </svg>
    </div>
  </body>
</html>
